name: Shared CI

on:
  workflow_call:
    inputs:
      commands:
        description: Commands to run in the calling repository
        required: true
        type: string
      runs_on:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Maximum job duration in minutes
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Check out calling repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run validation commands
        shell: bash
        env:
          CI_COMMANDS: ${{ inputs.commands }}
        run: bash -euo pipefail -c "$CI_COMMANDS"
